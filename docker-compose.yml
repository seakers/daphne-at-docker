name: hera-bayesian

services:

  backend:
    build:
      context: ./daphne_brain
      dockerfile: Dockerfile
    container_name: daphne-at-hera-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8002:8002'
    volumes:
      - ./daphne_brain:/usr/src/app
      - ./logs:/usr/src/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=daphne_brain.settings
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=daphne
      - POSTGRES_USER=daphne
      - POSTGRES_PASSWORD=daphnetest
      - POSTGRES_HOST=daphne-at-hera-db
      - POSTGRES_PORT=5432
      - REDIS_HOST=daphne-at-hera-redis
      - REDIS_PORT=6379
      - api_key=${api_key}
    networks:
      - daphne-network
    # command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    command: sh -c "python manage.py migrate && python manage.py runserver --noreload 0.0.0.0:8002"

  frontend:
    build:
      context: ./daphne-at-interface
      dockerfile: Dockerfile
    container_name: daphne-at-hera-frontend
    depends_on:
      - backend
    ports:
      - '8081:8081'
    volumes:
      - ./daphne-at-interface:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - daphne-network
    command: npm run dev

  simulation:
    build:
      context: ./ECLSS
      dockerfile: Dockerfile
    container_name: daphne-at-hera-simulation
    depends_on:
      - backend
    volumes:
      - ./ECLSS:/app
    networks:
      - daphne-network
    command: python simulation.py

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: daphne-at-hera-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - daphne-network

  db:
    image: postgres
    container_name: daphne-at-hera-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=daphne
      - POSTGRES_USER=daphne
      - POSTGRES_PASSWORD=daphnetest
    ports:
      - '5432:5432'
    networks:
      - daphne-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  redis:
    image: redis:6.2-alpine
    container_name: daphne-at-hera-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - daphne-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

networks:
  daphne-network:
    driver: bridge